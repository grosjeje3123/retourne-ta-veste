<!DOCTYPE html><html><head><meta charset="utf-8"><style>
/* Idée de mise en page : des cartes à collectionner posées sur la table.
   Recto en couleur avec toutes les infos, dos guilloché commun à toutes les cartes.
   Gabarit identique pour chaque carte : portrait de hauteur fixe, infos dessous.
   Cartes candidat : bord à la couleur du bloc officiel (grille du ministère), du rouge au bleu nuit ;
   vert pour Les Écologistes, gris pour « divers ». Jamais une couleur choisie au cas par cas.
   Cartes action : violet. Les couleurs de la carte ne suivent pas le thème ; tout est en cqi. */
:root{
  --page:#eef0ec; --page-texte:#15171a; --page-texte-2:#4d535b;
  --c-papier:#f8f9f6; --c-encre:#15171a; --c-encre-2:#4d535b;
  --c-surligneur:#f1fb4e; --c-violet:#5a2d8c; --c-violet-fonce:#341a57; --c-violet-clair:#efe8f7;
  --c-sarcelle:#0f5f66; --c-sarcelle-clair:#e2f0ef;
  --titre:"Fraunces", "Iowan Old Style", Georgia, serif;
  --texte:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --chiffre:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#131518; --page-texte:#eceee8; --page-texte-2:#a4aab1; color-scheme:dark; }
}
:root[data-theme="dark"]{ --page:#131518; --page-texte:#eceee8; --page-texte-2:#a4aab1; color-scheme:dark; }

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--page-texte);font-family:var(--texte);font-size:17px;line-height:1.5}
.page{max-width:1120px;margin:0 auto;padding:28px 20px 56px}
.marque{font-family:var(--chiffre);font-size:13px;color:var(--page-texte-2);margin:0 0 10px}
.fluo{background:var(--c-surligneur);color:var(--c-encre);padding:0 .2em}
h1{font-family:var(--titre);font-weight:900;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.chapo{margin:0;color:var(--page-texte-2);max-width:62ch}
.groupe{font-family:var(--titre);font-weight:900;font-size:clamp(23px,4vw,30px);line-height:1.1;margin:48px 0 6px}
.groupe-texte{margin:0;color:var(--page-texte-2);max-width:66ch}
.table{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;align-items:flex-start;margin-top:26px}
.emplacement{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.legende{display:flex;align-items:center;gap:12px;font-family:var(--chiffre);font-size:13px;color:var(--page-texte-2);min-height:32px}
.retourner{font-family:var(--chiffre);font-size:13px;background:transparent;color:var(--page-texte);border:1px solid var(--page-texte);border-radius:2px;padding:6px 10px;cursor:pointer}
.retourner:focus-visible,a:focus-visible{outline:3px solid var(--c-violet);outline-offset:2px}
.note{font-size:14.5px;color:var(--page-texte-2);margin:40px auto 0;max-width:66ch;text-align:center}

/* Carte retournable */
.retournable,.carte-seule{width:clamp(270px,86vw,330px);container-type:inline-size}
.retournable{perspective:1400px;cursor:pointer}
.interieur{position:relative;width:100%;aspect-ratio:5/8;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.retournable.retournee .interieur{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){ .interieur{transition:none} }
.face{position:absolute;inset:0;border:2px solid var(--c-encre);border-radius:16px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 1px 0 rgba(21,23,26,.10),0 12px 28px rgba(21,23,26,.26)}
.dos{transform:rotateY(180deg)}
.carte-seule .face{position:relative;inset:auto;width:100%;aspect-ratio:5/8;transform:none}

/* Recto, commun */
.recto{background:var(--c-violet);padding:2.4cqi;display:flex;flex-direction:column;gap:1.8cqi;color:var(--c-encre)}
.recto.candidat{background:linear-gradient(160deg,var(--bloc) 0%,var(--bloc) 55%,var(--bloc-fonce) 100%)}
[data-bloc="extreme-gauche"]{--bloc:#8f1d1d;--bloc-fonce:#5e1010;--bloc-clair:#f6e1df}
[data-bloc="gauche"]{--bloc:#d63a32;--bloc-fonce:#9e241e;--bloc-clair:#fbe4e1}
[data-bloc="ecolo"]{--bloc:#2e9a4e;--bloc-fonce:#1c6a34;--bloc-clair:#e1f2e6}
[data-bloc="centre"]{--bloc:#f0931c;--bloc-fonce:#a85d00;--bloc-clair:#fdeed7}
[data-bloc="divers"]{--bloc:#6a7077;--bloc-fonce:#454b51;--bloc-clair:#eceef0}
[data-bloc="droite"]{--bloc:#2a6fcf;--bloc-fonce:#1a4a91;--bloc-clair:#e1eaf8}
[data-bloc="extreme-droite"]{--bloc:#26367d;--bloc-fonce:#151e4a;--bloc-clair:#e2e5ef}
/* Jauge du haut de carte : l'échiquier de gauche à droite, le repère sur le bloc officiel */
.axe{position:relative;width:34cqi;height:2.6cqi;border:1px solid var(--c-papier);border-radius:2cqi;background:linear-gradient(90deg,#8f1d1d 0%,#d63a32 27%,#f0931c 50%,#2a6fcf 73%,#26367d 100%)}
.axe i{position:absolute;left:var(--x);top:50%;width:4.4cqi;height:4.4cqi;transform:translate(-50%,-50%) rotate(45deg);background:var(--c-papier);border:1.5px solid var(--c-encre);box-shadow:1px 1px 0 var(--c-encre)}
.nuancier{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 8px}
.nuancier li{display:inline-flex;align-items:center;gap:6px;font-family:var(--chiffre);font-size:13px;color:var(--page-texte)}
.nuancier li::before{content:"";width:18px;height:12px;border-radius:3px;border:1.5px solid var(--page-texte);background:var(--bloc)}
.haut{display:flex;justify-content:space-between;align-items:center;padding:0 .8cqi;min-height:9.6cqi}
.type{font-family:var(--chiffre);font-weight:700;font-size:3.1cqi;letter-spacing:.1em;text-transform:uppercase;color:var(--c-papier)}
.code{font-family:var(--titre);font-weight:900;font-size:7.6cqi;line-height:1;background:var(--c-surligneur);color:var(--c-encre);border:1.5px solid var(--c-encre);padding:.4cqi 2.2cqi .9cqi;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--c-encre)}
.bloc{font-family:var(--chiffre);font-weight:700;font-size:3.1cqi;line-height:1;letter-spacing:.06em;text-transform:uppercase;background:var(--c-surligneur);color:var(--c-encre);border:1.5px solid var(--c-encre);padding:1.4cqi 2.2cqi;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--c-encre)}
.panneau{flex:1 1 auto;min-height:0;background:var(--c-papier);border:1.5px solid var(--c-encre);border-radius:9px;overflow:hidden;display:flex;flex-direction:column}
.portrait{position:relative;flex:0 0 62cqi;margin:0;overflow:hidden;border-bottom:1.5px solid var(--c-encre);
  background-color:var(--c-surligneur);
  background-image:radial-gradient(circle,rgba(21,23,26,.17) 0 1.15px,transparent 1.5px),radial-gradient(circle,rgba(21,23,26,.17) 0 1.15px,transparent 1.5px);
  background-size:8px 8px;background-position:0 0,4px 4px}
/* Fenêtre commune à tous les portraits : de 3 % à 62 % de la hauteur de l'image */
.portrait img{position:absolute;height:169.5%;width:auto;max-width:none;left:50%;top:-5.1%;transform:translateX(-50%)}
.etiquette,.mention-ia{position:absolute;font-family:var(--chiffre);font-weight:700;font-size:2.8cqi;line-height:1;letter-spacing:.06em;text-transform:uppercase;padding:1.2cqi 1.8cqi}
.etiquette{top:1.8cqi;right:1.8cqi;background:var(--c-encre);color:var(--c-papier)}
.mention-ia{left:1.8cqi;bottom:1.8cqi;background:var(--c-papier);color:var(--c-encre);border:1px solid var(--c-encre)}
.tampon{position:absolute;right:2.4cqi;bottom:2.8cqi;font-family:var(--chiffre);font-weight:700;font-size:3.1cqi;line-height:1;letter-spacing:.08em;text-transform:uppercase;color:var(--c-violet);background:rgba(248,249,246,.92);border:2px solid var(--c-violet);border-radius:3px;padding:1.2cqi 2cqi;transform:rotate(-6deg)}
.tampon sup{text-transform:none;letter-spacing:0}
.candidat .tampon{color:var(--bloc-fonce);border-color:var(--bloc-fonce)}
.infos{flex:1 1 auto;min-height:0;padding:2.6cqi 3.2cqi 2.8cqi;display:flex;flex-direction:column;gap:2cqi}
.identite h3{font-family:var(--titre);font-weight:600;font-size:6.5cqi;line-height:1.05;margin:0}
.role{font-family:var(--chiffre);font-size:3.1cqi;line-height:1.3;color:var(--c-encre-2);margin:.8cqi 0 0}
sup{font-size:.68em;line-height:0}
.sources{margin:auto 0 0;font-family:var(--chiffre);font-size:2.75cqi;line-height:1.4;color:var(--c-encre-2)}
.sources a{color:var(--c-encre);text-underline-offset:2px}

/* Recto, carte action */
.pouvoir{border-top:1.5px solid var(--c-encre);padding-top:2cqi}
.pouvoir p{margin:0;font-size:4cqi;line-height:1.3}
.pouvoir .petit{font-family:var(--chiffre);font-size:3.1cqi;color:var(--c-encre-2);margin-top:1.3cqi}
.vraie-vie{background:var(--c-violet-clair);border-radius:6px;padding:2cqi 2.4cqi;display:grid;gap:1.3cqi}
.vraie-vie .lib{font-family:var(--chiffre);font-weight:700;font-size:2.9cqi;line-height:1;letter-spacing:.08em;text-transform:uppercase;color:var(--c-violet);margin:0}
.vraie-vie p{margin:0;font-size:3.6cqi;line-height:1.3}
.ligne{display:grid;grid-template-columns:29cqi 1fr auto;gap:2cqi;align-items:center;font-size:3.4cqi;line-height:1.2}
.barre{height:2.8cqi;border:1px solid var(--c-encre);background:var(--c-papier)}
.barre i{display:block;height:100%;width:calc(var(--v) / var(--max) * 100%);background:var(--c-encre)}
.ligne.elle .barre i{background:var(--c-surligneur);border-right:1px solid var(--c-encre)}
.ligne b{font-family:var(--chiffre);font-size:3.6cqi;font-variant-numeric:tabular-nums;min-width:5cqi;text-align:right}
.frise{list-style:none;margin:0;padding:0;display:grid;gap:1cqi}
.frise li{display:grid;grid-template-columns:9cqi 1fr;gap:1.8cqi;font-size:3.4cqi;line-height:1.25;align-items:baseline}
.frise b{font-family:var(--chiffre);font-size:3.2cqi;color:var(--c-violet)}

/* Recto, carte candidat */
.valeurs{position:absolute;top:1.8cqi;left:1.8cqi;width:18cqi;height:18cqi;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;background:var(--c-papier);border:1.5px solid var(--c-encre);border-radius:2.4cqi;box-shadow:2px 2px 0 var(--c-encre);font-family:var(--chiffre);font-weight:700;font-size:4.4cqi;line-height:1}
.valeurs .h{grid-area:1/2}.valeurs .g{grid-area:2/1}.valeurs .d{grid-area:2/3}.valeurs .b{grid-area:3/2}
.phrase{margin:0;background:var(--bloc-clair,var(--c-sarcelle-clair));border-radius:6px;padding:2cqi 2.4cqi;display:grid;gap:1.1cqi}
.phrase p{margin:0;font-family:var(--titre);font-weight:600;font-size:4.2cqi;line-height:1.22}
.phrase footer{font-family:var(--chiffre);font-size:2.8cqi;line-height:1.3;color:var(--c-encre-2)}
.faits{margin:0;display:grid;gap:1.3cqi;border-top:1.5px solid var(--c-encre);padding-top:1.9cqi}
.faits div{display:grid;grid-template-columns:15cqi 1fr;gap:1.6cqi;align-items:baseline}
.faits dt{font-family:var(--chiffre);font-weight:700;font-size:2.7cqi;letter-spacing:.06em;text-transform:uppercase;color:var(--bloc-fonce,var(--c-sarcelle))}
.faits dd{margin:0;font-size:3.3cqi;line-height:1.28}
.annees{font-family:var(--chiffre);font-variant-numeric:tabular-nums}
.annees b{background:var(--c-surligneur);border:1px solid var(--c-encre);padding:0 .7cqi}

/* Dos */
.dos{background:radial-gradient(circle at 50% 50%,#7b46b9 0%,var(--c-violet) 42%,var(--c-violet-fonce) 100%)}
.dos svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ===== Le jeu, l'Hémicycle =====
   IDÉE : une partie de Triple Triad posée sur un tapis sarcelle, le plateau (4×4 avec bancs bloqués, ou 3×3) figurant les sièges.
   IMAGE : les cartes en miniature (portrait, losange de valeurs, bandeau du camp) et un hémicycle de 10 sièges pour le score.
   COULEURS : sarcelle neutre pour le tapis (aucun bloc ne la porte) ; ton camp en surligneur, celui de l'IA en encre ; violet pour les cartes action.
   TYPE : Fraunces pour les titres et bannières, JetBrains Mono pour les chiffres, Atkinson pour le texte. */
[hidden]{display:none !important}
.cache-visuel{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,.case:focus-visible{outline:3px solid var(--c-surligneur);outline-offset:2px}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font-family:var(--chiffre);font-weight:700;font-size:15px;background:var(--c-surligneur);color:var(--c-encre);border:2px solid var(--c-encre);border-radius:3px;padding:11px 16px;min-height:44px;box-shadow:3px 3px 0 var(--c-encre);text-decoration:none}
.cta:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--c-encre)}
#vue-cartes{padding-bottom:100px}
.cta-flottant{position:fixed;right:20px;bottom:20px;z-index:20;margin:0;box-shadow:3px 3px 0 var(--c-encre),0 8px 22px rgba(0,0,0,.28);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.cta-flottant.visible{opacity:1;transform:none;pointer-events:auto}
.cta-flottant.visible:hover{transform:translate(-1px,-1px)}
@media (max-width:600px){ .cta-flottant{left:50%;right:auto;bottom:14px;transform:translate(-50%,12px)} .cta-flottant.visible,.cta-flottant.visible:hover{transform:translateX(-50%)} }
@media (prefers-reduced-motion:reduce){ .cta-flottant{transition:none} }
.groupe-texte a{color:inherit;text-underline-offset:2px}

.jeu{max-width:1180px;margin:0 auto;padding:14px 16px 48px}
.tete-jeu{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.retour{font-family:var(--chiffre);font-size:14px;color:var(--page-texte);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.titre-jeu{font-family:var(--titre);font-weight:900;font-size:clamp(28px,4.4vw,40px);line-height:1.05;margin:0;flex:1 1 auto}
.boutons-jeu{display:flex;gap:8px;flex-wrap:wrap}
.bouton,.bouton-sec{font-family:var(--chiffre);font-weight:700;font-size:14px;min-height:44px;padding:10px 14px;border-radius:3px;border:2px solid var(--c-encre);cursor:pointer}
.bouton{background:var(--c-surligneur);color:var(--c-encre);box-shadow:2px 2px 0 var(--c-encre)}
.bouton-sec{background:transparent;color:inherit;border-color:currentColor}
.bouton:disabled,.bouton-sec:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

.tapis{margin-top:10px;border-radius:22px;padding:16px;color:var(--c-papier);
  background:radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.14),transparent 55%),repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),var(--c-sarcelle);
  box-shadow:inset 0 0 0 2px var(--c-encre),0 14px 30px rgba(21,23,26,.25)}
.arene{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:start}
.camp{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px}
.camp-nom{margin:0;font-family:var(--chiffre);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.oeil{font-weight:400}
.pastille{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--c-encre);flex:none}
.pastille.j{background:var(--c-surligneur)}.pastille.ia{background:var(--c-encre);border-color:var(--c-papier)}
.main{display:flex;flex-direction:column;align-items:center;min-height:130px}
.carte-main{display:block;width:104px;padding:0;border:0;background:none;color:inherit;cursor:pointer;transition:transform .18s ease;border-radius:10px}
.main .carte-main+.carte-main{margin-top:-56px}
.main-joueur .carte-main:not(:disabled):hover{transform:translateX(-6px)}
.main-joueur .carte-main.sel{transform:translateX(-18px)}
.main-joueur .carte-main.sel .mc{box-shadow:0 0 0 3px var(--c-papier),0 10px 22px rgba(0,0,0,.4)}
.carte-main:disabled{cursor:default}
.carte-main.ia{cursor:default}
.carte-main.cible{cursor:pointer}
.main-vide{margin:0;font-family:var(--chiffre);font-size:13px;opacity:.8}
.lien-details{background:none;border:0;color:var(--c-papier);font-family:var(--chiffre);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 6px}

.centre{display:flex;flex-direction:column;align-items:center;gap:8px}
.tete-plateau{display:flex;align-items:center;gap:12px;width:100%;justify-content:center;flex-wrap:wrap}
.tableau{display:flex;flex-direction:column;align-items:center;margin:0}
.tableau svg{width:150px;height:auto;display:block}
.siege-j{fill:var(--c-surligneur);stroke:var(--c-encre);stroke-width:2}
.siege-ia{fill:var(--c-encre);stroke:var(--c-papier);stroke-width:1.6}
.perchoir-dessin{fill:var(--c-papier)}
.compte{margin:-2px 0 0;display:flex;align-items:baseline;gap:10px;font-family:var(--chiffre);font-size:13px}
.compte b{font-family:var(--titre);font-weight:900;font-size:26px;line-height:1}
.perchoir{margin:0;min-height:52px;flex:1 1 220px;max-width:360px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;font-weight:700;font-size:16px;line-height:1.3}
.perchoir .bouton-sec{min-height:40px;padding:6px 12px}
.plateau{--case:clamp(84px,11.5vw,128px);display:grid;grid-template-columns:repeat(3,var(--case));gap:8px;padding:10px;border-radius:16px;background:rgba(6,34,37,.5);box-shadow:inset 0 2px 12px rgba(0,0,0,.4),0 0 0 1.5px rgba(248,249,246,.18)}
.case{position:relative;display:block;width:var(--case);aspect-ratio:4/5;padding:0;border:0;border-radius:10px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(248,249,246,.2);color:inherit;font:inherit;cursor:pointer;perspective:700px}
.case.libre{cursor:default}
.case.libre.jouable{cursor:pointer;box-shadow:inset 0 0 0 2px rgba(241,251,78,.6)}
.case.libre.jouable:hover{background:rgba(241,251,78,.14)}
.case .rot{position:absolute;inset:0;transform-style:preserve-3d}
.case .rot>.mc{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.case .rot>.verso{transform:rotateY(180deg)}
.case.cible{cursor:pointer}
/* Grand hémicycle, 4 × 4 */
.plateau.n4{--case:clamp(70px,8.6vw,106px);grid-template-columns:repeat(4,var(--case));gap:7px}
/* Banc bloqué : hachures et plaque, comme les blocs du Tetra Master */
.case.banc{cursor:help;container-type:inline-size;display:grid;place-items:center;
  background:repeating-linear-gradient(135deg,rgba(248,249,246,.12) 0 6px,rgba(248,249,246,.03) 6px 12px),rgba(6,24,27,.6);
  box-shadow:inset 0 0 0 1.5px rgba(248,249,246,.3)}
.banc-plaque{display:flex;flex-direction:column;align-items:center;gap:5cqi;width:80%;padding:8cqi 3cqi 7cqi;border-radius:7px;background:var(--c-papier);color:var(--c-encre);border:1.5px solid var(--c-encre);box-shadow:2px 2px 0 rgba(0,0,0,.45);transform:rotate(-3deg)}
.banc-plaque svg{width:40cqi;height:40cqi}
.banc-plaque b{font-family:var(--chiffre);font-weight:700;font-size:8.6cqi;line-height:1;text-transform:uppercase;white-space:nowrap}
@container (max-width:92px){ .banc-plaque b{display:none} .banc-plaque{width:66%;padding:9cqi 3cqi} .banc-plaque svg{width:46cqi;height:46cqi} }
/* Glisser-déposer */
.main-joueur .carte-main{touch-action:none;-webkit-user-select:none;user-select:none}
@media (hover:hover){ .main-joueur .carte-main:not(:disabled){cursor:grab} }
.carte-main.glisse{opacity:.3}
.fantome{position:fixed;left:0;top:0;z-index:60;pointer-events:none;filter:drop-shadow(0 16px 22px rgba(0,0,0,.45))}
.fantome .mc{box-shadow:none}
.case.survolee{background:rgba(241,251,78,.22);box-shadow:inset 0 0 0 3px var(--c-surligneur)}
body.glisse-en-cours,body.glisse-en-cours *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.case.cible .mc,.carte-main.cible .mc{outline:3px dashed var(--c-papier);outline-offset:3px}
.legende-cotes{margin:2px 0 0;font-family:var(--chiffre);font-size:13px;text-align:center;opacity:.92}

/* Carte en miniature */
.mc{display:block;position:relative;isolation:isolate;container-type:inline-size;aspect-ratio:4/5;width:100%;border-radius:9px;overflow:hidden;border:3px solid var(--bord);
  background-color:var(--c-surligneur);
  background-image:radial-gradient(circle,rgba(21,23,26,.17) 0 1.1px,transparent 1.4px),radial-gradient(circle,rgba(21,23,26,.17) 0 1.1px,transparent 1.4px);background-size:7px 7px;background-position:0 0,3.5px 3.5px;
  box-shadow:0 2px 0 rgba(0,0,0,.3),0 8px 16px rgba(0,0,0,.3)}
.mc.j{--bord:var(--c-surligneur);--bande:var(--c-surligneur);--bande-t:var(--c-encre)}
/* Carte de l'IA : fond nuit, pois clairs. Une carte prise change donc de fond en entier, pas seulement de liseré */
.mc.ia{--bord:var(--c-encre);--bande:var(--c-encre);--bande-t:var(--c-papier);background-color:#2b2f36;
  background-image:radial-gradient(circle,rgba(248,249,246,.2) 0 1.1px,transparent 1.4px),radial-gradient(circle,rgba(248,249,246,.2) 0 1.1px,transparent 1.4px)}
.mc.n{--bord:var(--c-papier);--bande:var(--c-papier);--bande-t:var(--c-encre);background-color:var(--c-papier)}
/* Éclat au moment où une carte change de camp */
@keyframes eclat{0%{box-shadow:0 0 0 0 var(--eclat),0 8px 16px rgba(0,0,0,.3)}70%{box-shadow:0 0 0 12px transparent,0 8px 16px rgba(0,0,0,.3)}100%{box-shadow:0 0 0 0 transparent,0 8px 16px rgba(0,0,0,.3)}}
.case.eclat .mc{animation:eclat .6s ease-out}
.case.pour-j{--eclat:rgba(241,251,78,.95)}
.case.pour-ia{--eclat:rgba(248,249,246,.8)}
.mc::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--c-encre);pointer-events:none}
.mc[data-bloc]::before{content:"";position:absolute;z-index:1;left:0;right:0;top:0;height:6.5cqi;background:var(--bloc);border-bottom:1px solid var(--c-encre)}
.mc[data-bloc] .mv,.mc[data-bloc] .badge{top:9cqi}
.mc[data-bloc] .badge+.badge{top:37cqi}
.mc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mv{position:absolute;top:4cqi;left:4cqi;width:44cqi;height:44cqi;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;background:var(--c-papier);color:var(--c-encre);border:1.5px solid var(--c-encre);border-radius:7cqi;box-shadow:1.5px 1.5px 0 var(--c-encre);font-family:var(--chiffre);font-weight:700;font-size:15cqi;line-height:1}
.mv .h{grid-area:1/2}.mv .g{grid-area:2/1}.mv .d{grid-area:2/3}.mv .b{grid-area:3/2}
.mv .boost{background:var(--c-violet);color:var(--c-papier);border-radius:3cqi;padding:.5cqi 1.5cqi}
.mn{position:absolute;left:0;right:0;bottom:0;background:var(--bande);color:var(--bande-t);font-family:var(--chiffre);font-weight:700;font-size:11.5cqi;line-height:1;text-align:center;padding:4cqi 2cqi 4.5cqi;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:4cqi;right:4cqi;width:25cqi;height:25cqi;border-radius:50%;background:var(--c-violet);border:1.5px solid var(--c-papier);display:grid;place-items:center}
.badge svg{width:64%;height:64%}
.badge+.badge{top:32cqi}
.mc.dos-mini{--bord:var(--c-encre);background:radial-gradient(circle at 50% 45%,#7b46b9 0%,var(--c-violet) 48%,var(--c-violet-fonce) 100%)}
.mc.dos-mini svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes pose{from{transform:translateY(-16px) scale(1.08);opacity:.2}to{transform:none;opacity:1}}
.mc.pose{animation:pose .34s cubic-bezier(.2,.8,.3,1)}
@keyframes bascule{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.rot.bascule{animation:bascule .72s cubic-bezier(.3,.7,.3,1)}
@keyframes menace{0%,100%{box-shadow:0 0 0 3px var(--c-surligneur)}50%{box-shadow:0 0 0 7px rgba(241,251,78,.35)}}
.case.menace .rot>.mc:first-child{animation:menace .9s ease-in-out infinite}

/* Cartes action en miniature */
.slot{display:flex;flex-direction:column;align-items:center;margin-top:4px}
.slot-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.slot-btn.inerte{cursor:default}
.slot-lib{font-family:var(--chiffre);font-size:13px}
.ma{position:relative;display:block;width:88px;aspect-ratio:4/5;border-radius:9px;overflow:hidden;border:3px solid var(--c-violet);background:var(--c-violet);container-type:inline-size;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.ma img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ma-code{position:absolute;left:5cqi;right:5cqi;bottom:6cqi;text-align:center;font-family:var(--titre);font-weight:900;font-size:13.5cqi;line-height:.95;background:var(--c-surligneur);color:var(--c-encre);border:1.5px solid var(--c-encre);padding:2.5cqi 1.5cqi 3.5cqi;transform:rotate(-3deg);text-wrap:balance;overflow-wrap:anywhere}
.ma-dos{background:radial-gradient(circle at 50% 45%,#7b46b9 0%,var(--c-violet) 48%,var(--c-violet-fonce) 100%);border-color:var(--c-encre)}
.ma-dos .ma-code{left:30%;right:30%;bottom:auto;top:32%;font-size:26cqi;line-height:1}
.ma.jouee{filter:grayscale(1) brightness(.75)}
.slot-btn:not(.inerte):hover .ma{transform:translateY(-3px)}

.journal{list-style:none;margin:14px auto 0;padding:0;max-width:760px;display:grid;gap:4px;font-size:15px;color:var(--page-texte-2)}
.journal li:first-child{color:var(--page-texte)}

/* Panneaux */
.voile{position:fixed;inset:0;z-index:20;background:rgba(10,12,14,.62);display:grid;place-items:center;padding:16px}
.dialogue{width:min(620px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--c-papier);color:var(--c-encre);border:2px solid var(--c-encre);border-radius:16px;box-shadow:6px 6px 0 var(--c-encre);padding:22px;font-size:16px}
.dialogue>h2,.dialogue form>h2{font-family:var(--titre);font-weight:900;font-size:30px;line-height:1.05;margin:0 0 12px}
.dialogue>p,.dialogue form>p,.dialogue>div>p.annonce-titre{margin:0 0 10px}
.dialogue fieldset{border:0;padding:0;margin:0 0 14px}
.dialogue legend{font-family:var(--chiffre);font-weight:700;font-size:13px;margin-bottom:6px}
.choix{display:grid;gap:6px}
.choix.trois{grid-template-columns:repeat(3,minmax(0,1fr))}
.choix label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--c-encre);border-radius:8px;cursor:pointer;min-height:44px;line-height:1.3}
.choix label:has(input:checked){background:var(--c-surligneur)}
.choix input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--c-violet);flex:none}
.choix small{display:block;color:var(--c-encre-2);font-size:14px;margin-top:2px}
.pied{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.aide{color:var(--c-encre-2);font-size:15px}
.aide.fort{color:var(--c-encre);font-weight:700}
.aide:empty{display:none}
.sous-titre{font-family:var(--chiffre);font-weight:700;font-size:13px;margin:12px 0 6px}
.regles{margin:0 0 12px;padding-left:22px;display:grid;gap:8px}
.regles a{color:var(--c-violet)}
.carte-dialogue{display:flex;justify-content:center;margin:4px 0 12px}
.cotes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.rangee,.vivier{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.choix-carte{display:block;padding:0;border:0;background:none;cursor:pointer;border-radius:10px}
.choix-carte:disabled{cursor:default}
.choix-carte.pris .mc{outline:3px solid var(--c-violet);outline-offset:2px}
.vivier .choix-carte:not(:disabled):hover .mc,.rangee .choix-carte:hover .mc{transform:translateY(-3px)}
.vivier .choix-carte .mc{transition:transform .15s}
.score-final{display:flex;align-items:center;gap:10px;font-family:var(--chiffre);font-size:16px}
.score-final b{font-family:var(--titre);font-weight:900;font-size:40px;line-height:1}

.banniere{position:fixed;left:50%;top:40%;z-index:30;transform:translate(-50%,-50%) rotate(-3deg) scale(.6);opacity:0;pointer-events:none;font-family:var(--titre);font-weight:900;font-size:clamp(28px,7vw,56px);line-height:1;background:var(--c-surligneur);color:var(--c-encre);border:2px solid var(--c-encre);box-shadow:5px 5px 0 var(--c-encre);padding:10px 22px 14px;white-space:nowrap;transition:opacity .2s,transform .28s cubic-bezier(.2,.9,.3,1.3)}
.banniere.on{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
.annonce{position:fixed;left:50%;top:50%;z-index:25;transform:translate(-50%,-50%);display:flex;gap:16px;align-items:center;width:min(520px,calc(100vw - 32px));background:var(--c-violet);color:var(--c-papier);border:2px solid var(--c-encre);border-radius:14px;box-shadow:6px 6px 0 var(--c-encre);padding:14px}
.annonce .ma{width:104px;flex:none;border-color:var(--c-papier)}
.annonce p{margin:0 0 6px}
.annonce-titre{font-family:var(--titre);font-weight:900;font-size:24px;line-height:1.05}
.annonce-nom{font-family:var(--chiffre);font-size:13px;opacity:.85}

/* La méthode des valeurs */
.regle{margin:26px 0 0;max-width:780px;background:var(--c-papier);color:var(--c-encre);border:2px solid var(--c-encre);border-radius:14px;box-shadow:5px 5px 0 var(--c-encre);padding:20px 22px 12px}
.regle h2{font-family:var(--titre);font-weight:900;font-size:clamp(23px,3.4vw,28px);line-height:1.1;margin:0 0 10px;text-wrap:balance}
.regle-corps p{margin:0 0 10px;max-width:68ch}
.regle-corps a{color:var(--c-violet);text-underline-offset:2px}
.regle-cotes{list-style:none;margin:4px 0 12px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 20px}
.regle-cotes li{display:flex;flex-direction:column;border-top:1.5px solid var(--c-encre);padding-top:6px}
.regle-cotes b{font-family:var(--chiffre);font-size:14px}
.formule{display:inline-block;font-family:var(--chiffre);font-weight:700;font-size:clamp(15px,2.4vw,19px);background:var(--c-surligneur);color:var(--c-encre);border:1.5px solid var(--c-encre);padding:6px 12px;transform:rotate(-1deg);margin:2px 0 14px !important}
.calcul-carte{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px;font-size:15px}
.calcul-carte li{border-top:1.5px solid var(--c-encre);padding-top:6px}
.calcul-carte b{font-family:var(--chiffre)}
.lien-inline{background:none;border:0;padding:0 2px;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:24px}
.methode{margin-top:8px}
.methode>p,.methode li{max-width:72ch}
.methode ul{padding-left:20px;display:grid;gap:6px}
.scroll{overflow-x:auto;margin-top:16px}
.tab-valeurs{border-collapse:collapse;width:100%;min-width:820px;font-size:15px}
.tab-valeurs th,.tab-valeurs td{padding:8px 10px;border-bottom:1px solid color-mix(in srgb,var(--page-texte) 22%,transparent);text-align:right;vertical-align:top}
.tab-valeurs th{font-family:var(--chiffre);font-size:13px;font-weight:700;vertical-align:bottom}
.tab-valeurs th:first-child,.tab-valeurs td:first-child,.tab-valeurs td:last-child,.tab-valeurs th:last-child{text-align:left}
.tab-valeurs td{font-variant-numeric:tabular-nums;white-space:nowrap}
.tab-valeurs small{display:block;font-size:13px;color:var(--page-texte-2);white-space:normal}
.tab-valeurs a{color:inherit;text-underline-offset:2px}
.tab-valeurs .notes{font-family:var(--chiffre);font-weight:700}

@media (max-width:860px){
  .arene{grid-template-columns:minmax(0,1fr);gap:12px}
  .camp-ia{order:1}.centre{order:2}.camp-joueur{order:3}
  .camp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;justify-items:start;padding-top:0}
  .camp-nom{grid-column:1;grid-row:1;justify-content:flex-start}
  .slot{grid-column:2;grid-row:1;margin:0}
  .slot-btn{flex-direction:row;gap:8px}
  .slot .ma{width:42px;border-width:2px}
  .main{grid-column:1/-1;grid-row:2;flex-direction:row;justify-content:center;width:100%;min-height:0;gap:6px}
  .lien-details{grid-column:1/-1;grid-row:3;justify-self:center}
  .main .carte-main+.carte-main{margin-top:0}
  .main .carte-main{width:calc((100% - 24px) / 5);max-width:96px}
  .main-ia .carte-main{width:40px}
  .main-joueur .carte-main:not(:disabled):hover{transform:none}
  .main-joueur .carte-main.sel{transform:translateY(-10px)}
  .main-joueur .mn{display:none}
  .main-joueur .mv{width:56cqi;height:56cqi;font-size:19cqi}
  .main-ia .mv{display:none}
  .plateau{--case:calc((min(100vw,560px) - 96px) / 3)}
  .plateau.n4{--case:calc((min(100vw,560px) - 94px) / 4);gap:6px;padding:8px}
}
@media (max-width:600px){
  .tapis{padding:12px;border-radius:16px}
  .jeu{padding:6px 12px 40px}
  .tete-jeu{justify-content:space-between;flex-wrap:nowrap}
  .titre-jeu{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .retour{font-size:13px}
  .boutons-jeu .bouton,.boutons-jeu .bouton-sec{font-size:13px;padding:8px 10px}
  .slot-lib{display:none}
  .tete-plateau{flex-wrap:nowrap;gap:10px}
  .tableau svg{width:96px}
  .compte{font-size:13px;gap:6px}
  .compte b{font-size:20px}
  .perchoir{font-size:15px;min-height:48px;flex:1 1 auto;justify-content:flex-start;text-align:left}
  .case{aspect-ratio:1/1}
  .case .rot>.mc{aspect-ratio:auto;height:100%}
  .main-ia .carte-main{width:34px}
  .slot .ma{width:36px}
  .choix.trois{grid-template-columns:minmax(0,1fr)}
  .regle{padding:16px 16px 8px}
  .regle-cotes{grid-template-columns:minmax(0,1fr)}
  .rangee,.vivier{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dialogue{padding:18px}
}
@media (prefers-reduced-motion:reduce){
  .mc.pose,.rot.bascule,.case.menace .mc,.case.eclat .mc{animation:none}
  .banniere,.carte-main{transition:none}
}
